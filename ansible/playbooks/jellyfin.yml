---
# Deploy Jellyfin media server on storage node
- name: "Deploy Jellyfin Pod and Service"
  hosts: storage_nodes
  become: true
  pre_tasks:
    - name: "Ensure python3 venv support is installed"
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-distutils
        state: present
        update_cache: yes

    - name: "Try installing versioned venv package (python3.11-venv) if available"
      ansible.builtin.apt:
        name: python3.11-venv
        state: present
        update_cache: no
      ignore_errors: yes
    - name: "Create a dedicated venv for Ansible kubernetes client"
      ansible.builtin.command:
        cmd: /usr/bin/python3 -m venv /opt/ansible-venv
        creates: /opt/ansible-venv/bin/python

    - name: "Bootstrap pip inside the venv (ensurepip) if needed"
      ansible.builtin.command:
        cmd: /opt/ansible-venv/bin/python -m ensurepip --upgrade
      register: ensurepip_out
      changed_when: ensurepip_out.rc == 0
      failed_when: false

    - name: "Ensure pip and setuptools are available in the venv"
      ansible.builtin.command:
        cmd: /opt/ansible-venv/bin/python -m pip install --upgrade pip setuptools
      register: pip_upgrade
      changed_when: pip_upgrade.rc == 0
      failed_when: pip_upgrade.rc != 0

    - name: "Install kubernetes Python client into the venv via python -m pip"
      ansible.builtin.command:
        cmd: /opt/ansible-venv/bin/python -m pip install kubernetes
      register: pip_install
      changed_when: pip_install.rc == 0
      failed_when: pip_install.rc != 0

    - name: "Switch Python interpreter to the venv for subsequent tasks"
      ansible.builtin.set_fact:
        ansible_python_interpreter: /opt/ansible-venv/bin/python
        cacheable: yes

    - name: "Reconnect to use the venv Python interpreter"
      ansible.builtin.meta: reset_connection

  tasks:
    - name: "Create Jellyfin namespace"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir + '/../../manifests/jellyfin/jellyfin.yaml') }}"
        wait: yes
        apply: yes
      register: jellyfin_namespace
      failed_when: jellyfin_namespace.failed

    - name: "Apply Jellyfin manifest"
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/../../manifests/jellyfin/jellyfin.yaml"
        wait: yes
        apply: yes
      register: jellyfin_deploy
      failed_when: jellyfin_deploy.failed

    - name: "Display Jellyfin deployment status"
      debug:
        msg: "Jellyfin deployment: {{ jellyfin_deploy }}"
