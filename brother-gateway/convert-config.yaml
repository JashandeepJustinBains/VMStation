apiVersion: v1
kind: ConfigMap
metadata:
  name: scan-convert-scripts
  namespace: default
data:
  convert.sh: |-
    #!/usr/bin/env bash
    set -euo pipefail
    SRC_DIR="/scans/originals"
    OUT_DIR="/scans/pdfs"
    mkdir -p "$OUT_DIR"
    # Find common image extensions and convert to PDF if PDF doesn't already exist
    find "$SRC_DIR" -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.tif" -o -iname "*.tiff" \) | while read -r src; do
      base=$(basename "$src")
      name="${base%.*}"
      out="$OUT_DIR/${name}.pdf"
      if [[ -f "$out" ]]; then
        echo "PDF already exists for $src -> $out"
        continue
      fi
      echo "Converting $src -> $out"
      # Use ImageMagick convert (container image must provide `convert`)
      convert "$src" "$out" || echo "convert failed for $src"
      # Ensure group ownership and restrictive perms so only jjbly group can manage
      chown :jjbly "$out" || true
      chmod 0640 "$out" || true
    done

  sync-to-paperless.sh: |-
    #!/usr/bin/env bash
    set -euo pipefail
    SRC_DIR="/scans/pdfs"
    DEST_DIR="/paperless/input"
    mkdir -p "$DEST_DIR"
    # Copy PDFs without removing source files. Skip files already copied by checksum/mtime.
    rsync -av --ignore-existing --include='*/' --include='*.pdf' --exclude='*' "$SRC_DIR/" "$DEST_DIR/"
    # Set restrictive perms on the destination copies so Paperless can read but automation cannot remove originals
    find "$DEST_DIR" -type f -name '*.pdf' -exec chown :jjbly {} \; -exec chmod 0644 {} \;

  convert-watch.sh: |-
    #!/usr/bin/env bash
    set -eu
    SRC_DIR="/scans/originals"
    OUT_DIR="/scans/pdfs"
    PAPERLESS_IN="/paperless/input"
    mkdir -p "$OUT_DIR" "$PAPERLESS_IN"

    # Wait until file size stabilizes (no change for 2 seconds)
    wait_until_stable() {
      local f="$1"
      local prev=0
      for i in 1 2 3 4 5; do
        if [[ ! -f "$f" ]]; then
          return 1
        fi
        size=$(stat -c%s "$f" 2>/dev/null || echo 0)
        if [[ "$size" -eq "$prev" && "$size" -gt 0 ]]; then
          return 0
        fi
        prev=$size
        sleep 1
      done
      return 1
    }

    inotifywait -m -e close_write --format '%w%f' "$SRC_DIR" | while read -r file; do
      case "${file,,}" in
        *.png|*.jpg|*.jpeg|*.tif|*.tiff)
          echo "Detected $file"
          if wait_until_stable "$file"; then
            base=$(basename "$file")
            name="${base%.*}"
            out="$OUT_DIR/${name}.pdf"
            if [[ -f "$out" ]]; then
              echo "PDF exists for $file -> $out"
            else
              echo "Converting $file -> $out"
              convert "$file" "$out" || { echo "convert failed for $file"; continue; }
              chown :jjbly "$out" || true
              chmod 0640 "$out" || true
              # Copy to Paperless input (copy-only)
              rsync -av --ignore-existing --include='*/' --include='*.pdf' --exclude='*' "$out" "$PAPERLESS_IN/"
              echo "Copied $out -> $PAPERLESS_IN/"
            fi
          else
            echo "File $file did not stabilize; skipping for now"
          fi
          ;;
        *)
          echo "Ignored $file"
          ;;
      esac
    done
